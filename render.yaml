services:
  - type: web
    name: styleschat-chikolee353-rgb
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: styleschat-db
          property: connectionString
      - key: JWT_SIGNING_KEY
        generateValue: true

databases:
  - name: styleschat-db
    databaseName: styleschat
    user: styleschat
    plan: free
    region: oregon
