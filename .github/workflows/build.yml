name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup.NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Install MAUI Android
      run: dotnet workload install maui-android
    - name: Restore
      run: dotnet restore "STYLES CHAT/STYLES CHAT.csproj"
    - name: Build APK
      run: dotnet publish "STYLES CHAT/STYLES CHAT.csproj" -f net8.0-android -c Release -o out
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StylesChat-APK
        path: out/*.apk
