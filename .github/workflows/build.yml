name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Setup MAUI
      run: dotnet workload install maui
      
    - name: Build Android
      run: dotnet build StylesChat/StylesChat.csproj -c Release -f net8.0-android
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StylesChat-Android-APK
        path: StylesChat/bin/Release/net8.0-android/**/*.apk