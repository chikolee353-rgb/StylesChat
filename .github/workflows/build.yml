name: Build and Package

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build server
        run: dotnet build src/Server/Server.csproj -c Release
      - name: Publish Android client
        run: dotnet publish src/Client/Client.csproj -f net10.0-android -c Release -o publish/android
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MasVegas-Chat-Android
          path: publish/android/*.apk
